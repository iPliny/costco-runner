name: Crawl online prices

# Runs in the PUBLIC repo iPliny/costco-runner (public repos have unlimited free
# Actions minutes). This repo holds ONLY this file: no code, no data. It checks
# out the PRIVATE repo iPliny/costco-price-jp with a fine-grained token, runs the
# crawler code from there, and pushes the result back. Logs here are public, so
# every step's output goes to a file and only counts are printed. No artifacts.
on:
  schedule:
    - cron: "0 21 * * *"   # 06:00 JST
  workflow_dispatch:

permissions:
  actions: write   # keepalive below
  contents: read

concurrency:
  group: crawl-online
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v4
        with:
          repository: iPliny/costco-price-jp
          token: ${{ secrets.COSTCO_REPO_TOKEN }}
          path: repo
      - name: Fetch catalogue
        id: catalog
        continue-on-error: true
        working-directory: repo
        run: python3 tools/crawl_catalog.py --no-history > "$RUNNER_TEMP/catalog.log" 2>&1
      - name: Keep catalogue snapshot
        if: always()
        working-directory: repo
        run: |
          if [ -f data/online_catalog_today.csv ]; then
            cp data/online_catalog_today.csv "$RUNNER_TEMP/online_catalog_today.csv"
          fi
          if [ "${{ steps.catalog.outcome }}" != "success" ]; then
            rm -f data/online_catalog_today.csv
            echo "catalogue fetch failed; using the item crawl only"
          fi
      - name: Fetch prices
        working-directory: repo
        env:
          CRAWL_BUDGET_MIN: "150"
        run: |
          set +e
          python3 tools/crawl_online.py --catalog data/online_catalog_today.csv > "$RUNNER_TEMP/fetch.log" 2>&1
          rc=$?
          grep -E '^(done:|stopping early:|fetching )' "$RUNNER_TEMP/fetch.log"
          exit $rc
      - name: Merge into the latest main and push
        working-directory: repo
        run: |
          git config user.name "online-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            {
              if [ -f "$RUNNER_TEMP/online_catalog_today.csv" ]; then
                partial=()
                if [ "${{ steps.catalog.outcome }}" != "success" ]; then partial=(--partial); fi
                python3 tools/crawl_catalog.py --merge-only --snapshot "$RUNNER_TEMP/online_catalog_today.csv" "${partial[@]}"
              fi
              python3 tools/crawl_online.py --merge-only
              python3 tools/crawl_online.py --check-freshness
            } > "$RUNNER_TEMP/merge.log" 2>&1 || { echo "merge or freshness check failed"; exit 1; }
            git add data/observations.csv data/online_match.csv data/product_names.csv
            if [ -d data/online_catalog ]; then
              find data/online_catalog -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]-[0-9][0-9].csv' -exec git add -- {} +
            fi
            if git diff --cached --quiet; then echo "No price changes."; exit 0; fi
            git commit -q -m "Online prices $(TZ=Asia/Tokyo date +%F)"
            if git push -q origin HEAD:main; then echo "pushed"; exit 0; fi
            sleep 20
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
      # GitHub disables schedules in public repos after 60 days without activity;
      # re-enabling the workflow resets that timer.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/crawl-online.yml/enable" >/dev/null || true
